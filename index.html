/* v5.1.0 — 계산 엔진 단일화: 화면 · A4 · 검증(_검증/verify_cio.py)이 같은 cioCalc()를 쓴다
   근거(LawMCP 원문 대조 2026-10-16)
   · 옥내소화전설비의 화재안전성능기준(NFPC 102) 소방청고시 제2025-25호(타법개정, 2026. 3. 1. 시행)
   · 옥내소화전설비의 화재안전기술기준(NFTC 102) 국립소방연구원공고 제2026-34호(2026. 7. 1. 시행)
   · 옥외소화전설비의 화재안전성능기준(NFPC 109) 소방청고시 제2025-28호(2025. 12. 31. 일부개정, 2026. 3. 1. 시행)
   · 옥외소화전설비의 화재안전기술기준(NFTC 109) 국립소방연구원공고 제2026-9호(2026. 3. 1. 시행)
   · 고층건축물의 화재안전기술기준(NFTC 604) 공고 제2023-44호(2023. 12. 20.) */
var H_FLOW_PER  = 130;   /* 옥내소화전 1개 130 L/min 이상(계산 130) — NFPC 102 제5조①3호 · 4호 */
var H_NOZZLE    = 17;    /* 옥내 노즐선단 0.17 MPa 이상 ≒ 17 m — NFPC 102 제5조①3호 */
var O_FLOW_PER  = 350;   /* 옥외소화전 1개 350 L/min 이상(계산 350) — NFPC 109 제5조①3호 */
var O_NOZZLE    = 25;    /* 옥외 노즐선단 0.25 MPa 이상 ≒ 25 m — NFPC 109 제5조①3호 */
var O_MAX_N     = 2;     /* 옥외소화전 설치개수(2개 이상이면 2개) — NFPC 109 제4조① */
var O_WATER_PER = 7;     /* 옥외소화전 1개당 7 m³ — NFPC 109 제4조① · NFTC 109 2.1.1 */
var VEL_MAIN    = 4;     /* 펌프 토출 측 주배관 4 m/s 이하 — NFTC 102 2.3.5 (옥외 기준에는 유속 규정 없음 → 준용 참고) */
var MPA_M       = 0.00980665;

/* 강관 내경 = KS 외경 − 2 × 두께 (KS D 3507 · KS D 3562 Sch 40 — 옥내 · 옥외소화전 · 겸용 v5.1.0과 같은 규격표).
   STS · CPVC 내경과 C값(120 · 150)은 MANMIN 참고값(화재안전기준에 수치 없음) */
var PIPE_CONFIG = {
  SCH10:{label:"배관용 탄소강관 KS D3507 (백관)",        shortLabel:"KS D3507",       C:120,
         inner:{25:27.6,32:35.7,40:41.6,50:52.9,65:67.9,80:80.7,100:105.3,125:130.8,150:155.2,200:204.7}},
  SCH40:{label:"압력 배관용 탄소강관 KS D 3562 (흑관)",  shortLabel:"KS D3562",       C:120,
         inner:{25:27.2,32:35.5,40:41.2,50:52.7,65:65.9,80:78.1,100:102.3,125:126.6,150:151.0,200:199.9}},
  STS:  {label:"배관용 스테인리스 강관 KS D 3576 · 3595", shortLabel:"STS(스테인리스)",C:150,
         inner:{25:27.6,32:36.8,40:42.8,50:54.8,65:70.0,80:85.0,100:108.2,125:133.4,150:160.0,200:210.0}},
  CPVC: {label:"소방용 합성수지배관 CPVC (설치장소 제한)", shortLabel:"CPVC",        C:150,
         inner:{25:26.6,32:35.1,40:40.9,50:52.5,65:62.7,80:79.4,100:101.6,125:127.0,150:154.1,200:203.2}},
};
/* [90°엘보,45°엘보,분류T,직류T,Gate,Ball,Angle,Check] — 관부속 상당직관 길이(m) · MANMIN 참고값 */
var FITTING_EQ={
  25:[0.9,0.54,1.5,0.27,0.18,7.5,4.5,2.0],  32:[1.2,0.72,1.8,0.36,0.24,10.5,5.4,2.5],
  40:[1.5,0.90,2.1,0.45,0.30,13.8,6.5,3.1], 50:[2.1,1.20,3.0,0.60,0.39,16.5,8.4,4.0],
  65:[2.4,1.30,3.6,0.75,0.48,19.5,10.2,4.6],80:[3.0,1.80,4.5,0.90,0.60,24.0,12.0,5.7],
  100:[4.2,2.40,6.3,1.20,0.81,37.5,16.5,7.6],125:[5.1,3.00,7.5,1.50,0.99,42.0,21.0,10.0],
  150:[6.0,3.60,9.0,1.80,1.20,49.5,24.0,12.0],200:[6.5,3.70,14.0,4.00,1.40,70.0,33.0,15.0],
};
/* 호스 마찰손실률(m/100 m) · 호스릴 고정값 — MANMIN 참고값 */
var H_HOSE_TYPES={
  1:{label:"40mm 아마호스",     rate:26, fixed:null},
  2:{label:"40mm 고무내장호스", rate:12, fixed:null},
  3:{label:"50mm 아마호스",     rate:7,  fixed:null},
  4:{label:"50mm 고무내장호스", rate:3,  fixed:null},
  5:{label:"25mm 호스릴",       rate:0,  fixed:14},
};
/* 옥외소화전 호스 구경 65 mm — NFPC 109 제6조② · NFTC 109 2.3.2 / 손실률은 MANMIN 참고값 */
var O_HOSE_TYPES={
  1:{label:"65mm 마(아마)호스",  rate:8, fixed:null},
  2:{label:"65mm 고무내장호스",  rate:4, fixed:null},
};
var TRANS_TYPE={1:{label:"전동기 직결",k:1.1},2:{label:"전동기 이외의 원동기",k:1.15}};   /* MANMIN 참고값 */
var H_PIPE_SIZES=[40,50,65,80,100,125,150,200];
var O_PIPE_SIZES=[40,50,65,80,100,125,150,200];
var C_PIPE_SIZES=[65,80,100,125,150,200];
var PUMP_SIZES=[40,50,65,80,100,125,150];
var HP_STEPS=[3,5,7.5,10,15,20,25,30,40,50,60,75,100,125,150,200];

/* v5.1.0 — 마찰계수(m/100 m). v5.0은 m/m 값을 다시 ÷100 해 손실수두가 1/100로 계산되던 것을 정정 */
function calcFriction(Q,D,pipeType){
  if(!Q||!D)return 0;
  var cfg=PIPE_CONFIG[pipeType]||PIPE_CONFIG.SCH10;
  var Di=cfg.inner[D]; if(!Di)return 0;
  return 10.67*Math.pow(Q/60000,1.852)/(Math.pow(cfg.C,1.852)*Math.pow(Di/1000,4.87))*100;
}
function calcVelocity(Q,D,pipeType){
  if(!Q||!D)return 0;
  var cfg=PIPE_CONFIG[pipeType]||PIPE_CONFIG.SCH10;
  var Di=cfg.inner[D]; if(!Di)return 0;
  return (Q/60000)/(Math.PI*Math.pow(Di/2000,2));
}
function nextHP(kw){var hp=kw*1.341;for(var h of HP_STEPS){if(h>=hp)return h;}return Math.ceil(hp/5)*5;}
/* 구간 1줄 — 상당직관 · 마찰계수 · 손실수두 · 유속 · 유속 판정 */
function segDet(s,pipeType,vlim){
  var eq=FITTING_EQ[s.dia]||FITTING_EQ[100];
  var counts=[s.e90,s.e45,s.teeB,s.teeS,s.gate,s.ball,s.angle,s.check];
  var fl=counts.reduce(function(a,c,j){return a+(+c||0)*eq[j];},0);
  var tl=(+s.len||0)+fl;
  var fric=calcFriction(s.flow,s.dia,pipeType);
  var hl=fric*tl/100;
  var vel=calcVelocity(s.flow,s.dia,pipeType);
  return {eq:eq,counts:counts,fl:fl,tl:tl,fric:fric,hl:hl,vel:vel,vlim:vlim,velOver:vel>vlim};
}

function cioCalc(hSys,hSegs,oSys,oSegs,cSys,cSegs,buildingFloor){
  var bf=+buildingFloor||1;
  /* ── 공통 배관 (펌프 토출 측 — Q옥내 + Q옥외, v5.1.0 신설) — 손실을 두 설비 양정에 모두 더한다 · 4 m/s(NFTC 102 2.3.5) ── */
  var cPipe=cSys.pipeType||"SCH10";
  var cdets=(cSegs||[]).map(function(s){return segDet(s,cPipe,VEL_MAIN);});
  var Fc=cdets.reduce(function(a,d){return a+d.hl;},0);

  /* ── 옥내소화전 — NFPC 102 제4조① · 제5조①3호 · 4호 / NFTC 102 2.1.1 · 2.2.1.3 · 2.2.1.4 / 고층 NFTC 604 2.1.1 (5개 × 5.2 m³ · 50층 이상 7.8 m³) ── */
  var hMaxCount = bf===1 ? 2 : 5;
  var hWaterTime = bf===1 ? 20 : bf===2 ? 40 : 60;
  var hA=Math.min(hMaxCount,Math.max(1,hSys.hydrants|0));
  var hClpm=hA*H_FLOW_PER;
  var hD=hClpm*hWaterTime/1000;                       /* = A × 2.6 / 5.2 / 7.8 m³ */
  var hdets=hSegs.map(function(s){return segDet(s,hSys.pipeType,VEL_MAIN);});
  var hF=hdets.reduce(function(a,d){return a+d.hl;},0);
  var hose=H_HOSE_TYPES[hSys.hoseType]||H_HOSE_TYPES[2];
  var hG=hose.fixed!=null?hose.fixed:hose.rate*hSys.hoseLen/100;
  var hE=+hSys.actualHead;
  var hSub=hE+Fc+hF+hG+H_NOZZLE;
  var hI=hSub*0.1;                                    /* 안전율 10 % · 올림 = MANMIN 참고값 */
  var hJraw=hSub+hI; var hJ=Math.ceil(hJraw);

  /* ── 옥외소화전 — NFPC 109 제4조① · 제5조①3호 / NFTC 109 2.1.1 · 2.2.1.3 ── */
  var oA=Math.min(O_MAX_N,Math.max(1,oSys.hydrants|0));
  var oClpm=oA*O_FLOW_PER;
  var oD=oA*O_WATER_PER;
  var odets=oSegs.map(function(s){return segDet(s,oSys.pipeType,VEL_MAIN);});
  var oF=odets.reduce(function(a,d){return a+d.hl;},0);
  var ohose=O_HOSE_TYPES[oSys.hoseType]||O_HOSE_TYPES[2];
  var oG=ohose.rate*oSys.hoseLen/100;
  var oE=+oSys.actualHead;
  var oSub=oE+Fc+oF+oG+O_NOZZLE;
  var oI=oSub*0.1;
  var oJraw=oSub+oI; var oJ=Math.ceil(oJraw);

  /* ── 겸용 — 수원 · 토출량 = 각 설비 합 이상 (NFPC 102 제12조①② · NFPC 109 제11조①② · NFTC 102 2.9.1 · 2.9.2 · NFTC 109 2.8.1 · 2.8.2).
       NFTC 단서(최대의 것 이상)는 「고정식 소화설비가 2 이상」인 경우 — 옥내 · 옥외소화전은 고정식이 아니므로 항상 합산 ── */
  var Clpm=hClpm+oClpm;
  var D=hD+oD;
  /* 옥상수조 — 옥내소화전 유효수량 외 1/3 이상(NFPC 102 제4조② · NFTC 102 2.1.2 · 고층 NFTC 604 2.1.2), 단서 해당 시 면제.
     옥외소화전설비 기준에는 옥상수조 규정 없음 → 옥내소화전 유효수량에만 적용 */
  var roofEx=!!(+cSys.roofEx); var R=roofEx?0:hD/3; var Dt=D+R;
  /* 전양정 — 두 설비 중 큰 값(각 설비 성능에 지장이 없을 것: NFTC 102 2.2.1.5 · NFTC 109 2.2.1.4 단서) */
  var J=Math.max(hJ,oJ); var hHead=hJ>=oJ?"옥내소화전":"옥외소화전";
  var M=Clpm/1000; var N=cSys.pumpEff/100;
  var K=(TRANS_TYPE[cSys.transType]&&TRANS_TYPE[cSys.transType].k)||1.1;
  var Pkw=0.163*M*J*K/N; var Php=nextHP(Pkw);
  /* 고층건축물(bf 2 · 3)은 옥내소화전 펌프를 전용 + 예비펌프(NFTC 604 2.1.3) → 겸용 펌프 불가 경고(계산값은 참고로 그대로 표시) */

  /* ── 압력 판정(표시 전용 · 계산값 불변) — 겸용 전양정 J 기준
       S = J × 0.00980665 MPa — 1.2 MPa 이상이면
         옥내 KS D 3562 · 3583 (NFPC 102 제6조①2호 · NFTC 102 2.3.1.2)
         옥외 KS D 3562 · 3583 (NFTC 109 2.3.3.2) — NFPC 109 제6조③은 KS D 3562 · KS D 5301 (두 기준 병기)
         → 앱 선택지 중 KS D 3562만 적합(어느 기준이든 같음)
       옥내 최저층 노즐 Th = (J − 최저층 방수구 높이 − 호스 손실) × MPA — 0.7 MPa 초과 시 감압장치(NFPC 102 제5조①3호 단서)
       옥외 최저 노즐   To = (J − 최저 호스접결구 높이 − 호스 손실) × MPA — 0.7 MPa 초과 시 감압장치(NFPC 109 제5조①3호 단서)
       (배관 마찰 미차감 · 펌프 성능곡선 미반영 추정 — 보수적) ── */
  var Pdis=J*MPA_M; var hiPress=Pdis>=1.2;
  var okH=!hiPress||hSys.pipeType==="SCH40", okO=!hiPress||oSys.pipeType==="SCH40", okC=!hiPress||cPipe==="SCH40";
  var pipePressOK=okH&&okO&&okC;
  var hL=+(hSys.lowHead||0); var PlowH=(J-hL-hG)*MPA_M; var needPRVh=PlowH>0.7; var hStarH=J-hG-0.7/MPA_M;
  var oL=+(oSys.lowHead||0); var PlowO=(J-oL-oG)*MPA_M; var needPRVo=PlowO>0.7; var hStarO=J-oG-0.7/MPA_M;
  var velOverN=cdets.filter(function(d){return d.velOver;}).length+hdets.filter(function(d){return d.velOver;}).length+odets.filter(function(d){return d.velOver;}).length;

  return {
    Fc:Fc,cdets:cdets,cPipe:cPipe,
    H:{A:hA,B:H_FLOW_PER,Clpm:hClpm,D:hD,E:hE,Fc:Fc,F:hF,G:hG,H4:H_NOZZLE,I:hI,Jraw:hJraw,J:hJ,hose:hose,hMaxCount:hMaxCount,hWaterTime:hWaterTime,sdets:hdets,
       hL:hL,Plow:PlowH,needPRV:needPRVh,hStar:hStarH,pipeOK:okH},
    O:{A:oA,B:O_FLOW_PER,Clpm:oClpm,D:oD,E:oE,Fc:Fc,F:oF,G:oG,H4:O_NOZZLE,I:oI,Jraw:oJraw,J:oJ,hose:ohose,sdets:odets,
       hL:oL,Plow:PlowO,needPRV:needPRVo,hStar:hStarO,pipeOK:okO},
    C:{hiRise:bf>1,Clpm:Clpm,J:J,D:D,R:R,Dt:Dt,roofEx:roofEx,M:M,N:N,K:K,Pkw:Pkw,Php:Php,hHead:hHead,
       Pdis:Pdis,hiPress:hiPress,pipeOK:okC,pipePressOK:pipePressOK,velOverN:velOverN}
  };
}
window.CIOENG={calc:cioCalc,PIPE_CONFIG:PIPE_CONFIG,FITTING_EQ:FITTING_EQ,H_HOSE_TYPES:H_HOSE_TYPES,O_HOSE_TYPES:O_HOSE_TYPES,TRANS_TYPE:TRANS_TYPE};
</script>
<script type="text/babel" data-presets="env,react">
const { useState, useMemo, useEffect } = React;

/* 상수 · 계산 함수는 위 <script id="cio-engine"> (v5.1.0) */
const BD="1px solid #d1d5db";
const f2=v=>isNaN(v)?"-":Number(v).toFixed(2);
const f3=v=>isNaN(v)?"-":Number(v).toFixed(3);
const ff=(v,d=1)=>isNaN(v)?"-":Number(v).toFixed(d);

/* ── 공통 UI 컴포넌트 ── */
function LabelEl({children}){return <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:5,letterSpacing:"0.02em"}}>{children}</div>;}
function Sel({val,onChange,children,style={}}){
  return <select value={val} onChange={e=>onChange(e.target.value)}
    style={{width:"100%",padding:"8px 12px",borderRadius:8,border:BD,background:"white",fontSize:13,outline:"none",...style}}>{children}</select>;
}
function InpNum({val,onChange,unit,min,max}){
  return <div style={{display:"flex",alignItems:"center",gap:6}}>
    <input type="number" value={val} min={min} max={max}
      onChange={e=>onChange(+(e.target.value))}

    {unit&&<span style={{fontSize:12,color:"#6b7280",whiteSpace:"nowrap"}}>{unit}</span>}

}
function EffInp({val,onChange}){
  return <div style={{display:"flex",alignItems:"center",gap:6}}>
    <input type="number" value={val} min={10} max={80} step={1}
      onChange={e=>{const v=Math.min(80,Math.max(10,parseInt(e.target.value)||10));onChange(v);}}

}
function Box({title,children,color="#1e3a5f"}){
  return <div style={{background:"white",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,0.08)",marginBottom:16,overflow:"hidden"}}>
    <div className="box-hd" style={{background:color}}>{title}</div>
    <div className="box-bd">{children}</div>
  </div>;
}
function Card({label,value,unit,formula,bc}){
  const cols={blue:["#f0fdf4","#15803d"],orange:["#f0fdf4","#15803d"],green:["#f0fdf4","#15803d"],red:["#f0fdf4","#15803d"],teal:["#f0fdf4","#15803d"]};
  const [bg,tc]=cols[bc]||["#f8fafc","#374151"];
  return <div style={{background:bg,borderRadius:10,padding:"12px 14px",border:`1px solid ${tc}22`}}>
    <div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>{label}</div>
    <div style={{fontSize:20,fontWeight:900,color:tc,fontFamily:"'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace",lineHeight:1.1}}>
      {value}<span style={{fontSize:11,color:"#9ca3af",marginLeft:4}}>{unit}</span>
    </div>
    {formula&&<div style={{fontSize:11,color:"#9ca3af",marginTop:4,fontFamily:"'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace"}}>{formula}</div>}
  </div>;
}
function PipeTable({segs,setSegs,pipeType,pipeSizes,velLimit,label,velLabel,flowOpts,hdColor}){
  const HDRS=["NO","유량\n(ℓ/min)","관경\n(A)","직관\n(m)","90°\nElbow","45°\nElbow","분류\nTee","직류\nTee","Gate\nV/V","Ball\nV/V","Angle\nV/V","Check\nV/V","상당직관\n(m)","마찰계수\n(m/100m)","손실수두\n(m)","유속\n(m/s)","×"];
  const upd=(i,k,v)=>setSegs(p=>{const n=[...p];n[i]={...n[i],[k]:v};return n;});
  const add=()=>setSegs(p=>[...p,{flow:flowOpts?flowOpts[0]:(p.length?p[p.length-1].flow:130),dia:100,len:10,e90:0,e45:0,teeB:0,teeS:0,gate:0,ball:0,angle:0,check:0}]);
  const del=i=>setSegs(p=>p.filter((_,j)=>j!==i));
  return <Box title={label} color={hdColor||"#334155"}>
    {/* 모바일 스크롤 안내 (860px 이하에서만 표시) */}
    <div className="seg-hint">
      <span style={{fontSize:14}}>←</span>
      <span>좌우로 스크롤하여 모든 항목 입력</span>
      <span style={{fontSize:14}}>→</span>
    </div>
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
        <colgroup>
          <col style={{width:"3%"}}/><col style={{width:"7%"}}/><col style={{width:"6%"}}/><col style={{width:"6%"}}/>
          <col style={{width:"5%"}}/><col style={{width:"5%"}}/><col style={{width:"5%"}}/><col style={{width:"5%"}}/>
          <col style={{width:"5%"}}/><col style={{width:"5%"}}/><col style={{width:"5%"}}/><col style={{width:"5%"}}/>
          <col style={{width:"7%"}}/><col style={{width:"8%"}}/><col style={{width:"7%"}}/><col style={{width:"6%"}}/><col style={{width:"2%"}}/>

            const tl=(s.len||0)+fl;
            const fric=calcFriction(s.flow,s.dia,pipeType);
            const hl=fric*tl/100;
            const vel=calcVelocity(s.flow,s.dia,pipeType);
            const lim=velLimit||4;   /* v5.1.0 — 4 m/s 초과 ⚠ (NFTC 102 2.3.5) */

              <td style={{border:BD,padding:"2px"}}>
                <select value={s.dia} onChange={e=>upd(i,"dia",+e.target.value)}
                  style={{width:"100%",padding:"2px",fontSize:11,border:"none",background:"transparent",fontFamily:"'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif",outline:"none"}}>
                  {pipeSizes.map(d=><option key={d} value={d}>{d}</option>)}
                </select>
              </td>
              <td style={{border:BD,padding:"2px"}}>{num("len",s.len)}</td>
              {["e90","e45","teeB","teeS","gate","ball","angle","check"].map(k=>(
                <td key={k} style={{border:BD,padding:"2px"}}>{num(k,s[k])}</td>
              ))}
              <td style={{border:BD,padding:"4px 2px",textAlign:"center",fontSize:11,fontFamily:"'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace"}}>{f3(fl)}</td>
              <td style={{border:BD,padding:"4px 2px",textAlign:"center",fontSize:11,fontFamily:"'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace",color:"#15803d",fontWeight:700}}>{f3(fric)}</td>
              <td style={{border:BD,padding:"4px 2px",textAlign:"center",fontSize:11,fontFamily:"'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace",color:"#15803d",fontWeight:700}}>{f3(hl)}</td>
              <td style={{border:BD,padding:"4px 2px",textAlign:"center",fontSize:11,fontFamily:"'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace",color:vW?"#dc2626":"#374151",fontWeight:vW?700:400}}>{f2(vel)}{vW?" "+vW:""}</td>
              <td style={{border:BD,padding:"2px",textAlign:"center"}}><button onClick={()=>del(i)} style={{background:"#fee2e2",border:"none",borderRadius:4,cursor:"pointer",color:"#dc2626",fontSize:11,fontWeight:700,padding:"2px 6px"}}>×</button></td>
            </tr>;
          })}
          <tr style={{background:"#f1f5f9"}}>
            <td colSpan={14} style={{border:BD,padding:"5px 10px",fontWeight:700,fontSize:11,color:"#374151"}}>배관 마찰손실 합계</td>
            <td style={{border:BD,padding:"5px",textAlign:"center",fontFamily:"'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace",color:"#15803d",fontWeight:900,fontSize:13}}>
              {f3(segs.reduce((s2,s)=>{const eq=FITTING_EQ[s.dia]||FITTING_EQ[100];const fl=s.e90*eq[0]+s.e45*eq[1]+s.teeB*eq[2]+s.teeS*eq[3]+s.gate*eq[4]+s.ball*eq[5]+s.angle*eq[6]+s.check*eq[7];const tl=(s.len||0)+fl;return s2+calcFriction(s.flow,s.dia,pipeType)*tl/100;},0))}
            </td>
            <td colSpan={2} style={{border:BD}}></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div style={{marginTop:8,textAlign:"right"}}>
      <button onClick={add} style={{padding:"6px 14px",background:"#334155",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:12}}>+ 구간 추가</button>
    </div>
    <div style={{marginTop:8,padding:"7px 12px",background:"#f0fdf4",border:"1.5px solid #86efac",borderRadius:8,fontSize:11,color:"#166534",fontFamily:"'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif",fontWeight:600}}>
      {velLabel||`⚠️ 유속 제한: ≤ ${velLimit||4} m/s — 초과 시 ⚠ 표시`}
    </div>
    <div style={{marginTop:8,padding:"10px 14px",background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8}}>
      <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:6}}>【 관부속 상당직관 적용 참고사항 】</div>
      <ol style={{margin:0,paddingLeft:18,fontSize:11,color:"#6b7280",lineHeight:2}}>
        <li>Elbow, Tee는 <b>나사접합</b>을 기준으로 한 것임.&nbsp;&nbsp;(용접의 경우 손실을 더 적게 적용)</li>
        <li>Reducer는 <b>45°Elbow</b>와 같다.&nbsp;&nbsp;(다만, 관경이 작은 쪽에 따른다.)</li>
        <li>Coupling은 <b>직류 Tee</b>와 같다.</li>
        <li>Union, Flange, Socket은 손실수두가 미소하여 <b>생략</b>한다.</li>
        <li>Auto Valve(포소화전 설비), Glove Valve는 <b>Ball Valve</b>와 같다.</li>
        <li>Alarm Valve, Foot Valve 및 Strainer는 <b>Angle Valve</b>와 같다.</li>
      </ol>
    </div>
  </Box>;
}

      const outerW=outer.clientWidth;
      const scale=Math.min(1,(outerW-16)/A4W);
      const scaledW=A4W*scale;
      const offset=Math.max(0,(outerW-scaledW)/2);

          'transform-origin:top left;'+

  {showInstallBanner&&<div style={{position:"fixed",bottom:16,left:16,right:16,zIndex:9999}} className="pwa-install-banner"><div style={{borderRadius:16,padding:16,display:"flex",alignItems:"center",gap:12}}><img src="icons/icon-192.png" style={{width:48,height:48,borderRadius:12,flexShrink:0,boxShadow:"0 4px 12px rgba(0,0,0,0.3)"}} alt="겸용펌프 앱 아이콘"/><div style={{flex:1,minWidth:0}}><div style={{color:"white",fontSize:13,fontWeight:800}}>홈 화면에 설치하시겠습니까?</div><div style={{color:"#bbf7d0",fontSize:11,fontWeight:600,marginTop:4}}>오프라인에서도 사용 가능합니다</div></div><div style={{display:"flex",gap:8,flexShrink:0}}><button onClick={()=>setShowInstallBanner(false)} style={{color:"rgba(255,255,255,0.6)",fontSize:11,fontWeight:700,padding:"8px 12px",border:"none",background:"transparent",cursor:"pointer",borderRadius:8}}>닫기</button><button onClick={handleInstall} style={{background:"white",color:"#15803d",fontSize:11,fontWeight:900,padding:"8px 16px",border:"none",borderRadius:8,cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.2)"}}>설치</button></div></div></div>}

<!-- ═══════════════════════════════════════════════════════════════
     MANMIN 모바일 JPG 저장 v5.5 (v5.4 + R28 소제목 동반 이관 2026-09-05)
     · 인쇄(PDF)와 동일한 계산서 DOM을 캡처한다 → 두 출력물이 어긋날 수 없다
     · 쪽나눔 인식 : .page-break 클래스 + 인라인/계산 스타일(break-before:page) 모두
     · 분할 단위   : 한 장보다 큰 블록은 실측 높이를 보고 자식으로 내려가 잘게 쪼갠다
                    (블록이 통째로 넘어가 앞 장이 비는 현상 방지 · 최대 3단계)
     · 넘침 보호   : 유효높이(261mm) 초과 시 다음 장으로, 표는 행 단위로 분할
                    어떤 경우에도 내용을 잘라내지 않는다 (최후에는 페이지가 늘어난다)
     · 캡처 전 rpt-inner 축소 transform 해제 · document.fonts.ready 대기 · 백지 배경
     · 글자색 상속 : 캡처 페이지는 body 직속이라 #report-zone 의 color 규칙을 못 받는다.
       다크 테마 잔재로 body 가 연회색(#e2e8f0)인 도구에서 본문이 흐리게 찍히므로
       원본 계산서의 실제 글자색을 읽어 캡처 페이지에 명시한다 (밝으면 안전색 강제)
     · 2매 이상이면 저장 시트를 띄운다 — 브라우저는 자동 연속 다운로드를 차단하므로
       페이지마다 사용자가 직접 눌러 저장해야 전부 받을 수 있다 (전체 저장도 제공)
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  var CFG = window.MM_JPG_CONFIG || { zone:'#report-zone', name:'MANMIN', prepare:null };
  var VER = 'MANMIN-Ver5.0';

  var MM = function(v){ return v * 96 / 25.4; };
  var PAGE_W = MM(210), PAGE_H = MM(297);
  var PT = MM(14), PR = MM(12), PB = MM(22), PL = MM(14);
  var BODY_H = PAGE_H - PT - PB;                 /* 261mm = 986.5px */

  function two(n){ return (n<10?'0':'') + n; }

  function fileStamp(zone){
    var d = new Date();
    var ymd = d.getFullYear() + two(d.getMonth()+1) + two(d.getDate());
    var name = '';
    try{
      var tds = zone.querySelectorAll('td,th,div,span');
      for(var i=0;i<tds.length && i<400;i++){
        var t = (tds[i].textContent||'').trim();
        if(t.indexOf('공사명') === 0 && t.length < 60){
          name = t.replace(/^공사명\s*:?\s*/,'').trim(); break;
        }
      }
    }catch(e){}
    if(!name || name === '(미입력)') name = '';
    name = name.replace(/[\\\/:*?"<>|\s]+/g,'').slice(0,30);
    return (name ? name + '_' : '') + ymd;
  }

  /* 쪽나눔 판정 — 클래스·인라인 style·computed style 셋 다 본다 */
  function isBreak(el){
    if(!el || el.nodeType !== 1) return false;
    if(el.classList && el.classList.contains('page-break')) return true;
    var st = (el.getAttribute && el.getAttribute('style')) || '';
    if(/break-before\s*:\s*page|page-break-before\s*:\s*always/i.test(st)) return true;
    try{
      var cs = window.getComputedStyle(el);
      if(cs && (cs.breakBefore === 'page' || cs.pageBreakBefore === 'always')) return true;
    }catch(e){}
    return false;
  }
  function isSkipped(el){
    if(!el || el.nodeType !== 1) return true;
    if(el.id === 'dev-stamp' || el.id === 'mm-print-stamp') return true;
    return !!(el.classList && el.classList.contains('no-print'));
  }
  function cleanClone(node){
    var c = node.cloneNode(true);
    if(c.querySelectorAll){
      var junk = c.querySelectorAll('.no-print,#dev-stamp,#mm-print-stamp');
      for(var i=0;i<junk.length;i++){ if(junk[i].parentNode) junk[i].parentNode.removeChild(junk[i]); }
    }
    return c;
  }
  function stampEl(css, text){
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    d.textContent = text;
    return d;
  }

  /* 한 장보다 큰 블록은 자식으로 내려가 분할 단위를 잘게 만든다.
     원본(화면)에서 실측하므로 transform 해제 후에 호출해야 한다. */
  function measure(el){
    try{ return el.getBoundingClientRect().height; }catch(e){ return 0; }
  }
  function flatten(nodes, maxH, depth){
    var out = [];
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if(isSkipped(n)) continue;
      var kids = [];
      if(n.children){
        for(var j=0;j<n.children.length;j++){ if(!isSkipped(n.children[j])) kids.push(n.children[j]); }
      }
      if(depth < 3 && kids.length > 1 && n.tagName !== 'TABLE' && measure(n) > maxH){
        out = out.concat(flatten(kids, maxH, depth + 1));
      }else{
        out.push(n);
      }
    }
    return out;
  }


  function save(shot){
    var a = document.createElement('a');
    a.href = shot.url; a.download = shot.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  /* 2매 이상 저장 시트 — 브라우저는 스크립트가 연속으로 여러 파일을 내려받는 것을
     차단한다. 페이지마다 사용자가 직접 누르면 전부 정상 저장된다. */
  function openSheet(shots){
    var prev = document.getElementById('mm-save-ov');
    if(prev) prev.parentNode.removeChild(prev);
    var ov = document.createElement('div');
    ov.id = 'mm-save-ov';
    ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.62);' +
      'display:flex;align-items:center;justify-content:center;padding:16px;' +
      "font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif;";
    var bx = document.createElement('div');
    bx.style.cssText = 'background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:88vh;' +
      'display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.32);';
    var hd = document.createElement('div');
    hd.style.cssText = 'background:#1E3A5F;color:#fff;padding:14px 18px;display:flex;' +
      'align-items:center;justify-content:space-between;flex-shrink:0;';
    hd.innerHTML = '<b style="font-size:14px;font-weight:700;">🖼️ JPG 저장 — 전체 ' + shots.length + '장</b>' +
      '<span style="font-size:11px;opacity:.8;">페이지별로 눌러 저장하세요</span>';
    var bd = document.createElement('div');
    bd.style.cssText = 'padding:16px 18px;overflow-y:auto;display:grid;gap:12px;' +
      'grid-template-columns:repeat(auto-fill,minmax(150px,1fr));';
    shots.forEach(function(sh){
      var card = document.createElement('div');
      card.style.cssText = 'border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;background:#F8FAFC;';
      var img = document.createElement('img');
      img.src = sh.url;
      img.style.cssText = 'width:100%;display:block;background:#fff;border-bottom:1px solid #E5E7EB;';
      var btn = document.createElement('button');
      btn.textContent = sh.no + ' / ' + shots.length + '  저장';
      btn.style.cssText = 'width:100%;border:none;background:#1E3A5F;color:#fff;padding:9px;' +
        "font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;";
      btn.onclick = function(){ save(sh); btn.textContent = '✓ 저장됨'; btn.style.background = '#15803D'; };
      card.appendChild(img); card.appendChild(btn); bd.appendChild(card);
    });
    var ft = document.createElement('div');
    ft.style.cssText = 'padding:12px 18px;border-top:1px solid #E5E7EB;display:flex;gap:8px;' +
      'justify-content:flex-end;flex-shrink:0;background:#F8FAFC;';
    var all = document.createElement('button');
    all.textContent = '전체 저장 시도';
    all.style.cssText = 'height:38px;padding:0 18px;border-radius:9px;border:1.5px solid #1E3A5F;' +
      "background:#fff;color:#1E3A5F;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;";
    all.onclick = function(){
      shots.forEach(function(sh,i){ setTimeout(function(){ save(sh); }, i*420); });
      all.textContent = '전체 저장 실행됨';
    };
    var cl = document.createElement('button');
    cl.textContent = '닫기';
    cl.style.cssText = 'height:38px;padding:0 18px;border-radius:9px;border:none;' +
      "background:#1E3A5F;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;";
    cl.onclick = function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); };
    ft.appendChild(all); ft.appendChild(cl);
    bx.appendChild(hd); bx.appendChild(bd); bx.appendChild(ft);
    ov.appendChild(bx);
    ov.addEventListener('click', function(e){ if(e.target === ov) cl.onclick(); });
    document.body.appendChild(ov);
  }

  /* 원본 계산서의 실제 글자색을 읽어온다. 너무 밝으면(다크테마 잔재) 안전색으로 바꾼다. */
  function inkOf(el){
    var FALLBACK = '#111827';
    try{
      var c = window.getComputedStyle(el).color || '';
      var m = c.match(/rgba?\(([^)]+)\)/);
      if(!m) return FALLBACK;
      var v = m[1].split(',');
      var r = parseFloat(v[0]), g = parseFloat(v[1]), b = parseFloat(v[2]);
      var a = (v.length > 3) ? parseFloat(v[3]) : 1;
      if(a < 0.7) return FALLBACK;
      var lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
      return (lum > 0.55) ? FALLBACK : c;      /* 흰 종이 위에서 흐린 색이면 교체 */
    }catch(e){ return FALLBACK; }
  }

  function Builder(stage, base){
    this.stage = stage;
    this.base  = base || {};
    this.pages = [];
    this.newPage();
  }
  Builder.prototype.newPage = function(){
    var p = document.createElement('div');
    p.style.cssText =
      'position:relative;box-sizing:border-box;background:#FFFFFF;' +
      'width:' + PAGE_W + 'px;min-height:' + PAGE_H + 'px;' +   /* min-height : 잘라내지 않는다 */
      'padding:' + PT + 'px ' + PR + 'px ' + PB + 'px ' + PL + 'px;' +
      'color:' + (this.base.color || '#111827') + ';' +          /* 흐린 글자 방지 */
      'font-size:' + (this.base.fontSize || '13px') + ';' +
      'line-height:' + (this.base.lineHeight || '1.7') + ';' +
      'font-family:' + (this.base.fontFamily || "'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif") + ';';
    var b = document.createElement('div');
    b.style.cssText = 'display:flow-root;';                     /* 마진 상쇄 방지 */
    p.appendChild(b); this.stage.appendChild(p);
    this.cur = p; this.body = b; this.pages.push(p);
  };
  Builder.prototype.over  = function(){ return this.body.scrollHeight > BODY_H + 1; };
  Builder.prototype.empty = function(){ return this.body.children.length === 0; };

  Builder.prototype.add = function(node){
    var c = cleanClone(node);
    this.body.appendChild(c);
    if(!this.over()) return;
    if(this.body.children.length > 1){          /* ① 걸리면 통째로 다음 장 */
      this.body.removeChild(c);
      /* v5.5 (2026-09-05 · S10 R28) — 직전 요소가 소제목(짧은 비표 블록)이면 함께 넘긴다.
         인쇄의 .a4-sub+table{break-before:avoid} 와 같은 동작(§17-7). 소제목만 있는 쪽이면 넘기지 않고 아래 행 분할로 간다. */
      var kids = this.body.children, h = kids[kids.length-1];
      var isTit = !!h && h.tagName !== 'TABLE' && !h.querySelector('table') && h.getBoundingClientRect().height < 60;
      if(isTit && kids.length === 1){
        this.body.appendChild(c);
      }else{
        if(isTit) this.body.removeChild(h);
        this.newPage();
        if(isTit) this.body.appendChild(h);
        this.body.appendChild(c);
        if(!this.over()) return;
      }
    }
    this.splitTall(c);                          /* ② 한 장보다 길면 표를 행 단위로 */
  };

  Builder.prototype.splitTall = function(node){
    var table = (node.tagName === 'TABLE') ? node
              : (node.querySelector ? node.querySelector('table') : null);
    var tb = table && table.tBodies && table.tBodies[0];
    if(!tb || tb.rows.length < 3) return;        /* 분할 불가 → 페이지가 늘어날 뿐, 잘리지 않음 */
    var moved = [], guard = 0;
    while(this.over() && tb.rows.length > 1 && guard++ < 2000){
      moved.unshift(tb.rows[tb.rows.length-1]);
      tb.deleteRow(-1);
    }
    if(!moved.length) return;
    var cont = node.cloneNode(true);
    var ctb = (cont.tagName === 'TABLE') ? cont.tBodies[0] : cont.querySelector('tbody');
    if(!ctb) return;
    while(ctb.firstChild) ctb.removeChild(ctb.firstChild);
    for(var i=0;i<moved.length;i++) ctb.appendChild(moved[i]);
    this.newPage();
    this.body.appendChild(cont);
    if(this.over()) this.splitTall(cont);
  };

  Builder.prototype.finish = function(){
    var t = this.pages.length;
    for(var i=0;i<t;i++){
      this.pages[i].appendChild(stampEl(
        'right:' + PR + 'px;bottom:' + MM(9) + 'px;' +
        "font-family:'Orbitron','JetBrains Mono',sans-serif;font-weight:700;" +
        'font-size:8pt;color:#9ca3af;letter-spacing:0.08em;', VER));
      if(t > 1){                                 /* 2매 이상일 때만 쪽번호 */
        this.pages[i].appendChild(stampEl(
          'left:' + PL + 'px;bottom:' + MM(9) + 'px;' +
          "font-family:'JetBrains Mono','Pretendard Variable',Pretendard,'Noto Sans KR',monospace;" +
          'font-size:8pt;color:#9ca3af;letter-spacing:0.04em;', (i+1) + ' / ' + t));
      }
    }
    return t;
  };

  window.mmSaveJPG = function(){
    if(CFG.prepare && typeof window[CFG.prepare] === 'function'){
      try{ window[CFG.prepare](); }catch(e){ console.warn('[MANMIN JPG] prepare', e); }
    }
    var zone  = document.querySelector(CFG.zone);
    var inner = document.getElementById('rpt-inner');
    var btn   = document.getElementById('btn-jpg');
    if(!zone){ alert('계산서 영역을 찾지 못했습니다.'); return; }
    if(typeof html2canvas !== 'function'){
      alert('이미지 라이브러리를 불러오지 못했습니다.\n온라인 상태에서 한 번 실행하면 이후 오프라인에서도 저장됩니다.');
      return;
    }

    var label = btn ? btn.textContent : '';
    var keep  = inner ? inner.style.transform : '';
    if(btn){ btn.textContent = '⏳ 생성 중...'; btn.disabled = true; }
    if(inner){ inner.style.transform = 'none'; }

    var stage = document.createElement('div');
    stage.setAttribute('aria-hidden','true');
    stage.style.cssText = 'position:fixed;left:-20000px;top:0;z-index:-1;background:#fff;';
    document.body.appendChild(stage);

    var stamp = fileStamp(zone);
    var top = Array.prototype.slice.call(zone.children);
    var nodes = flatten(top, BODY_H, 0);      /* transform 해제 후 실측 → 분할 단위 결정 */

    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

    ready.then(function(){
      var zs = window.getComputedStyle(zone);
      var b = new Builder(stage, {
        color      : inkOf(zone),
        fontSize   : zs.fontSize,
        lineHeight : zs.lineHeight,
        fontFamily : zs.fontFamily
      });
      nodes.forEach(function(n){
        if(isBreak(n) && !b.empty()) b.newPage();
        b.add(n);
      });
      var total = b.finish();
      var shots = [];
      var chain = Promise.resolve();
      b.pages.forEach(function(page, i){
        chain = chain.then(function(){
          return html2canvas(page, {
            scale: 2, backgroundColor: '#FFFFFF',
            useCORS: true, allowTaint: true, logging: false,
            windowWidth: Math.ceil(PAGE_W), width: Math.ceil(PAGE_W),
            height: Math.ceil(page.getBoundingClientRect().height)
          }).then(function(canvas){
            shots.push({
              url : canvas.toDataURL('image/jpeg', 0.95),
              name: CFG.name + '_' + stamp + (total > 1 ? ('_' + (i+1)) : '') + '.jpg',
              no  : (i+1)
            });
          });
        });
      });
      return chain.then(function(){
        if(shots.length === 1){ save(shots[0]); return; }
        openSheet(shots);          /* 2매 이상 — 브라우저 연속 다운로드 차단 회피 */
      });
    }).catch(function(e){
      console.error('[MANMIN JPG]', e);
      alert('이미지 저장 중 오류가 발생했습니다.\n' + (e && e.message ? e.message : ''));
    }).then(function(){
      if(stage.parentNode) document.body.removeChild(stage);
      if(inner) inner.style.transform = keep;
      if(btn){ btn.textContent = label || '🖼️ JPG 저장'; btn.disabled = false; }
    });
  };
})();
</script>
